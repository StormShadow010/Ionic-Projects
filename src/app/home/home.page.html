<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> App Camera </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <img [src]="photoUrl()" alt="Foto tomada" />
  <ion-fab horizontal="end" vertical="bottom" (click)="takePicture()">
    <ion-fab-button>
      <ion-icon name="add   "></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
